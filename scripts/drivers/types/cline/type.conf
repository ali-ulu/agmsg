# agmsg agent-type manifest — read-only key=value DATA. NEVER sourced.
#
# cline: Cline CLI 3.x (and the desktop/kanban surface sharing the same home).
# Headless runs work (`cline -c <dir> "<prompt>"`), so a seat can be booted
# with an initial prompt. It has no agmsg delivery hook of its own, so the
# only valid mode is `off` — manual inbox checks.
#
# Known trap (verified on Windows): a one-word prompt is mistaken for a
# command, so any boot prompt must be more than a single token.
name=cline
template=template.md
cli=cline
detect_proc=cline cline-*
readiness_sentinel=no
delivery_modes=off
