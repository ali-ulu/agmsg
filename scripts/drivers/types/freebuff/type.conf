# agmsg agent-type manifest — read-only key=value DATA. NEVER sourced.
#
# freebuff: Freebuff CLI + Desktop. TUI-only — it ships no print/headless
# mode, so it is NOT spawnable (agmsg cannot pre-seed an initial prompt) and
# has no hook to deliver into; the only valid mode is `off`.
#
# It reads MCP servers from ~/.agents/mcp.json and standing instructions from
# ~/.knowledge.md, so a seat is driven by the human at the TUI.
name=freebuff
template=template.md
cli=freebuff
detect_proc=freebuff freebuff-*
readiness_sentinel=no
delivery_modes=off
