# agmsg agent-type manifest — read-only key=value DATA. NEVER sourced.
#
# dsh: DeepSeek Harness (Electron desktop). Not on PATH as a plain binary —
# its CLI is reached through the Electron host:
#   ELECTRON_RUN_AS_NODE=1 "<install>/DeepSeek Harness.exe" --expose-internals \
#     "<install>/resources/app.asar/dsh/node_modules/@deepseek-ai/dsh-desktop-host/lib/cli.js" \
#     headless "<prompt>"
#
# A headless run therefore exists, but the shipped dsh.cmd breaks from Git
# Bash on a path containing spaces (pass a C:/... style path, not $HOME's
# /c/... form). It also needs DEEPSEEK_API_KEY, which the desktop keeps in
# its own credentials service rather than the environment — without it a
# headless run exits MISSING_CREDENTIAL. Not spawnable for that reason, and
# it has no hook to deliver into, so the only valid mode is `off`.
name=dsh
template=template.md
detect_proc=DeepSeek?Harness dsh dsh-*
readiness_sentinel=no
delivery_modes=off
